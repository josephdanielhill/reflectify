<!DOCTYPE html>
<!--
  Reflectify — Hero / social marketing card  (BLD-1022, parent BLD-1021)
  Source: 1200 x 630  ->  rendered 1x (1200x630) and 2x (2400x1260)
  Brand tokens from ~/reflectify/style.css (PRV-5). Do not invent colours.
  Render:  ./render-cards.sh hero
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reflectify — Hero marketing card</title>
<style>
  @font-face { font-family:"Newsreader"; font-style:normal; font-weight:200 800; font-display:block;
    src:url("../vendor/fonts/newsreader-latin-variable.woff2") format("woff2"); }
  @font-face { font-family:"Inter"; font-style:normal; font-weight:100 900; font-display:block;
    src:url("../vendor/fonts/inter-latin-variable.woff2") format("woff2"); }

  :root {
    --paper:#F7F5F0;  --ink:#1E2421;  --moss:#2D4A3E;
    --eucalyptus:#8CAE9E;  --terracotta:#B0523A;
    --neutral-500:#978F80; --neutral-700:#585249;
    --font-display:"Newsreader", Georgia, "Times New Roman", serif;
    --font-body:"Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; }
  body { background:var(--paper); }

  .card {
    position:relative;
    width:1200px; height:630px;
    background:var(--paper);
    overflow:hidden;
    display:flex; align-items:center;
    padding:0 120px;              /* middle-80% horizontal safe area */
    gap:60px;
  }

  /* --- quiet brand mark, top-left, inside the vertical safe band --- */
  .card__brand {
    position:absolute; top:66px; left:120px;
    display:flex; align-items:center;
  }
  .card__brand svg { height:34px; width:auto; display:block; }

  .card__url {
    position:absolute; top:76px; right:120px;
    font-family:var(--font-body); font-size:14px; font-weight:500;
    letter-spacing:.04em; color:var(--neutral-500);
  }

  .card__copy { flex:0 1 700px; }

  .card__heading {
    font-family:var(--font-display);
    font-weight:500;
    font-size:92px;
    line-height:.98;
    letter-spacing:-.022em;
    color:var(--ink);
  }

  .card__rule {
    width:64px; height:2px; background:var(--eucalyptus);
    margin:30px 0 26px;
  }

  .card__sub {
    font-family:var(--font-body);
    font-size:22px; line-height:1.55; font-weight:400;
    color:var(--neutral-700);
    max-width:520px;
  }

  .card__cta {
    display:inline-flex; align-items:center; gap:12px;
    margin-top:38px;
    background:var(--terracotta);      /* the single accent on this card */
    color:var(--paper);
    font-family:var(--font-body); font-size:19px; font-weight:600;
    letter-spacing:.01em;
    padding:18px 36px;
    border-radius:999px;
  }
  .card__cta-arrow { display:block; }

  /* --- soft moss motif: rounded-square field + radar / score glyph --- */
  .card__motif {
    flex:0 0 260px;
    position:relative;
    width:260px; height:260px;
  }
  .motif__field {
    position:absolute; inset:0;
    background:var(--moss);
    border-radius:52px;
  }
  .motif__glyph { position:absolute; inset:0; display:block; }
  .motif__score {
    position:absolute; left:0; right:0; bottom:34px;
    text-align:center;
    font-family:var(--font-display); font-weight:500;
    font-size:38px; line-height:1; color:var(--paper);
    letter-spacing:-.01em;
  }
  .motif__score-label {
    position:absolute; left:0; right:0; bottom:16px;
    text-align:center;
    font-family:var(--font-body); font-size:11px; font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:var(--eucalyptus);
  }
</style>
</head>
<body>
  <div class="card" id="card">

    <div class="card__brand" data-check>
      <!-- inline so the document @font-face applies to the wordmark -->
      <svg viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reflectify">
        <g transform="translate(10, 10)">
          <rect x="0" y="0" width="40" height="40" rx="20" fill="#EBF3EF" />
          <path d="M20 8 C 10 18, 10 28, 20 34 C 30 28, 30 18, 20 8 Z" fill="#2D4A3E" />
          <path d="M20 14 C 27 19, 27 27, 20 31" stroke="#E8A88A" stroke-width="2.5" stroke-linecap="round" fill="none" />
        </g>
        <text x="62" y="38" font-family="'Newsreader', Georgia, serif" font-weight="500" font-size="28" fill="#2D4A3E" letter-spacing="-0.5">Reflectify</text>
      </svg>
    </div>

    <div class="card__url" data-check>reflectify.squarecircletriangle.co</div>

    <div class="card__copy">
      <h1 class="card__heading" data-check>Reflection<br>is a gift.</h1>
      <div class="card__rule"></div>
      <p class="card__sub" data-check>Turn AI conversations into clear personal insights.</p>
      <div class="card__cta" data-check>
        <span>Start a reflection</span>
        <svg class="card__cta-arrow" width="16" height="12" viewBox="0 0 16 12" fill="none" aria-hidden="true">
          <path d="M1 6h13M9.5 1.5 14 6l-4.5 4.5" stroke="#F7F5F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <div class="card__motif" data-check>
      <div class="motif__field"></div>
      <svg class="motif__glyph" viewBox="0 0 260 260" fill="none" aria-hidden="true">
        <!-- radar grid -->
        <g stroke="#8CAE9E" stroke-width="1.6" opacity=".55">
          <polygon points="130,64 192,109 168,182 92,182 68,109" />
          <polygon points="130,86 173,118 156,171 104,171 87,118" />
          <polygon points="130,108 154,126 144,159 116,159 106,126" />
          <path d="M130 64V130M192 109 130 130M168 182 130 130M92 182 130 130M68 109 130 130" />
        </g>
        <!-- reflection polygon -->
        <polygon points="130,72 183,113 160,174 100,176 76,112"
                 fill="#EBF3EF" fill-opacity=".28" stroke="#EBF3EF" stroke-width="2.4" stroke-linejoin="round" />
        <circle cx="130" cy="130" r="4" fill="#EBF3EF" />
      </svg>
      <div class="motif__score">7.8</div>
      <div class="motif__score-label">Reflection score</div>
    </div>

  </div>

  <script>
    // Render contract: fonts must be settled before headless capture.
    window.__cardReady = (async () => {
      await document.fonts.ready;
      await document.fonts.load('500 92px Newsreader');
      await document.fonts.load('400 22px Inter');
      await document.fonts.load('600 19px Inter');
      return document.fonts.check('500 92px Newsreader') && document.fonts.check('400 22px Inter');
    })();
    // Layout audit (?audit / #audit): measured rects + overflow, dumped as JSON for CI.
    if (location.hash === '#audit' || location.search.indexOf('audit') > -1) {
      window.__cardReady.then(() => {
        const card = document.getElementById('card');
        const cb = card.getBoundingClientRect();
        const rects = [...document.querySelectorAll('[data-check]')].map((el) => {
          const r = el.getBoundingClientRect();
          return {
            sel: el.className || el.tagName,
            x: +r.x.toFixed(1), y: +r.y.toFixed(1),
            w: +r.width.toFixed(1), h: +r.height.toFixed(1),
            right: +r.right.toFixed(1), bottom: +r.bottom.toFixed(1),
            insideCanvas: r.x >= -0.5 && r.y >= -0.5 && r.right <= cb.width + 0.5 && r.bottom <= cb.height + 0.5,
          };
        });
        const pre = document.createElement('pre');
        pre.id = '__audit';
        pre.textContent = JSON.stringify({
          canvas: { w: cb.width, h: cb.height },
          fontsLoaded: document.fonts.check('500 92px Newsreader') && document.fonts.check('400 22px Inter'),
          cardOverflow: { scrollW: card.scrollWidth, clientW: card.clientWidth, scrollH: card.scrollHeight, clientH: card.clientHeight },
          bodyOverflow: { scrollW: document.body.scrollWidth, scrollH: document.body.scrollHeight },
          rects,
        });
        document.body.appendChild(pre);
      });
    }
  </script>
</body>
</html>
